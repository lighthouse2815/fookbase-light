name: CI

on:
  # Tạm dừng CI tự động; vẫn có thể chạy thủ công khi cần.
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - run: npm ci
      - run: npx expo-doctor
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run export:android

  backend:
    runs-on: ubuntu-24.04
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore and build API
        run: |
          dotnet restore backend/Fookbase.Src/Fookbase.Api.csproj
          dotnet build backend/Fookbase.Src/Fookbase.Api.csproj --no-restore --configuration Release
      - name: Run isolated backend integration tests
        run: bash scripts/test-backend.sh
      - name: Check EF model has no pending changes
        env:
          ConnectionStrings__FookbaseDatabase: Host=postgres;Port=5432;Database=fookbase_ci;Username=fookbase_ci;Password=ci-only-not-production
          CHECK_EF_MODEL: true
        run: bash scripts/check-migrations.sh

  frontend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [web, zola-light, admin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install, lint, test and build ${{ matrix.app }}
        working-directory: frontend/${{ matrix.app }}
        run: |
          npm ci
          npm run lint
          if [ "${{ matrix.app }}" = "web" ]; then npm run test:group-header; fi
          npm run build

  container:
    runs-on: ubuntu-24.04
    env:
      POSTGRES_USER: fookbase_ci
      POSTGRES_PASSWORD: ci-only-not-production
      POSTGRES_DB: fookbase_db
      Jwt__SigningKey: ci-signing-key-with-more-than-thirty-two-characters
      AllowedHosts: api.ci.example.test
      Cors__AllowedOrigins__0: https://web.ci.example.test
      Cors__AllowedOrigins__1: https://admin.ci.example.test
      Cors__AllowedOrigins__2: https://zola-light.ci.example.test
      Cloudinary__CloudName: fookbase-ci
      Cloudinary__ApiKey: ci-only-not-production
      Cloudinary__ApiSecret: ci-only-not-production
    steps:
      - uses: actions/checkout@v7
      - name: Validate production Compose configuration
        run: docker compose -f compose.yml -f compose.prod.yml config --quiet
      - name: Build production API image
        run: docker build --file backend/Fookbase.Src/Dockerfile --tag fookbase-api:ci .
