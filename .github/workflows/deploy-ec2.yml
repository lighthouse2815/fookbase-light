name: Deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, fookbase-production]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Build main web
        working-directory: frontend/web
        run: |
          npm ci
          npm run build

      - name: Publish release source
        shell: bash
        run: |
          set -Eeuo pipefail
          git archive --format=tar "$GITHUB_SHA" | tar -x -C /srv/fookbase-light

      - name: Deploy API and apply migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          bash /srv/fookbase-light/scripts/deploy-ec2.sh

      - name: Publish main web
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -C frontend/web/dist -cf - . | sudo tar -xf - -C /var/www/fookbase
          sudo chown -R www-data:www-data /var/www/fookbase

      - name: Verify public deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error https://fookbase-light.duckdns.org/health/ready
          curl --fail --silent --show-error --output /dev/null https://fookbase-light.duckdns.org/
