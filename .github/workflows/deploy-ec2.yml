name: Deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, fookbase-production]

    steps:
      - name: Check out source
        # v4 uses the Node 20 action runtime supported by the installed EC2 runner.
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Keep this compatible with the runner while still installing Node 22 for the build.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Build main web
        working-directory: frontend/web
        env:
          VITE_SITE_URL: https://fookbase.io.vn
        run: |
          npm ci
          npm run build

      - name: Publish release source
        shell: bash
        run: |
          set -Eeuo pipefail
          release_dir=$(mktemp -d)
          trap 'rm -rf "$release_dir"' EXIT
          git archive --format=tar "$GITHUB_SHA" | tar -x -C "$release_dir"
          sudo rsync -a --delete \
            --exclude '.env.production*' \
            --exclude 'private/' \
            "$release_dir/" /srv/fookbase-light/

      - name: Deploy API and apply migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          bash /srv/fookbase-light/scripts/deploy-ec2.sh

      - name: Publish main web
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -C frontend/web/dist -cf - . | sudo tar -xf - -C /var/www/fookbase
          sudo chown -R www-data:www-data /var/www/fookbase

      - name: Verify public deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error https://fookbase.io.vn/health/ready
          curl --fail --silent --show-error --output /dev/null https://fookbase.io.vn/
