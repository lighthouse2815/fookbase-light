name: fookbase-light

services:
  api:
    build:
      context: .
      dockerfile: backend/Fookbase.Src/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      data-protection-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FookbaseDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fookbase_db};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__Issuer: ${Jwt__Issuer:-Fookbase.Identity}
      Jwt__Audience: ${Jwt__Audience:-Fookbase.Clients}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in .env}
      Jwt__AccessTokenExpirationMinutes: ${Jwt__AccessTokenExpirationMinutes:-15}
      Jwt__RefreshTokenExpirationDays: ${Jwt__RefreshTokenExpirationDays:-30}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${Cors__AllowedOrigins__1:-http://localhost:5174}
      Cors__AllowedOrigins__2: ${Cors__AllowedOrigins__2:-http://localhost:5175}
      Cloudinary__CloudName: ${Cloudinary__CloudName:?Set Cloudinary__CloudName in .env}
      Cloudinary__ApiKey: ${Cloudinary__ApiKey:?Set Cloudinary__ApiKey in .env}
      Cloudinary__ApiSecret: ${Cloudinary__ApiSecret:?Set Cloudinary__ApiSecret in .env}
      GoogleAuthentication__Enabled: ${GoogleAuthentication__Enabled:-false}
      GoogleAuthentication__ClientId: ${GoogleAuthentication__ClientId:-}
      GoogleAuthentication__ClientSecret: ${GoogleAuthentication__ClientSecret:-}
      GoogleAuthentication__WebBaseUrl: ${GoogleAuthentication__WebBaseUrl:-}
      GoogleAuthentication__ZolaLightBaseUrl: ${GoogleAuthentication__ZolaLightBaseUrl:-}
      GoogleAuthentication__MobileCallbackUrl: ${GoogleAuthentication__MobileCallbackUrl:-}
      GoogleAuthentication__ZolaMobileCallbackUrl: ${GoogleAuthentication__ZolaMobileCallbackUrl:-}
      PushNotifications__Enabled: ${PushNotifications__Enabled:-false}
      PushNotifications__ExpoPushApiUrl: ${PushNotifications__ExpoPushApiUrl:-https://exp.host/--/api/v2/push/send}
      PushNotifications__ExpoPushReceiptsUrl: ${PushNotifications__ExpoPushReceiptsUrl:-https://exp.host/--/api/v2/push/getReceipts}
      PushNotifications__ReceiptCheckIntervalMinutes: ${PushNotifications__ReceiptCheckIntervalMinutes:-15}
      AiChat__Enabled: ${AiChat__Enabled:-false}
      AiChat__Groq__ApiKey: ${AiChat__Groq__ApiKey:-}
      AiChat__Groq__ApiBaseUrl: ${AiChat__Groq__ApiBaseUrl:-https://api.groq.com/openai/v1/}
      AiChat__Groq__Model: ${AiChat__Groq__Model:-openai/gpt-oss-120b}
      AiChat__Gemini__ApiKey: ${AiChat__Gemini__ApiKey:-}
      AiChat__Gemini__ApiBaseUrl: ${AiChat__Gemini__ApiBaseUrl:-https://generativelanguage.googleapis.com/}
      AiChat__Gemini__Model: ${AiChat__Gemini__Model:-gemini-2.5-flash-lite}
      AiChat__OpenRouter__ApiKey: ${AiChat__OpenRouter__ApiKey:-}
      AiChat__OpenRouter__ApiBaseUrl: ${AiChat__OpenRouter__ApiBaseUrl:-https://openrouter.ai/api/v1/}
      AiChat__OpenRouter__Model: ${AiChat__OpenRouter__Model:-openrouter/free}
      AiChat__ApiKey: ${AiChat__ApiKey:-}
      AiChat__ApiBaseUrl: ${AiChat__ApiBaseUrl:-https://api.openai.com/}
      AiChat__Model: ${AiChat__Model:-gpt-5-mini}
      AiChat__RequestTimeoutSeconds: ${AiChat__RequestTimeoutSeconds:-45}
      AiChat__MaximumInputCharacters: ${AiChat__MaximumInputCharacters:-4000}
      AiChat__MaximumHistoryMessages: ${AiChat__MaximumHistoryMessages:-10}
      RateLimiting__AiChat__PermitLimit: ${RateLimiting__AiChat__PermitLimit:-10}
      RateLimiting__AiChat__WindowSeconds: ${RateLimiting__AiChat__WindowSeconds:-60}
      Email__Enabled: ${Email__Enabled:-false}
      Email__Host: ${Email__Host:-}
      Email__Port: ${Email__Port:-587}
      Email__UseSsl: ${Email__UseSsl:-true}
      Email__Username: ${Email__Username:-}
      Email__Password: ${Email__Password:-}
      Email__FromAddress: ${Email__FromAddress:-}
      Email__FromName: ${Email__FromName:-Fookbase}
      Email__FrontendBaseUrl: ${Email__FrontendBaseUrl:-http://localhost:5173}
      Sms__Enabled: ${Sms__Enabled:-false}
      Sms__Provider: ${Sms__Provider:-Traccar}
      Sms__AccessToken: ${Sms__AccessToken:-}
      Sms__TwoFactorApplicationId: ${Sms__TwoFactorApplicationId:-}
      Sms__BaseUrl: ${Sms__BaseUrl:-https://www.traccar.org/sms/}
      DataProtection__ApplicationName: ${DataProtection__ApplicationName:-Fookbase}
      DataProtection__KeyRingPath: /var/fookbase/data-protection-keys
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - data-protection-keys:/var/fookbase/data-protection-keys
    restart: unless-stopped

  data-protection-init:
    image: busybox:1.37.0-musl
    command: ["sh", "-c", "mkdir -p /var/fookbase/data-protection-keys && chown -R 10001:10001 /var/fookbase/data-protection-keys"]
    volumes:
      - data-protection-keys:/var/fookbase/data-protection-keys
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fookbase_db}
    ports:
      - "5432:5432"
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


volumes:
  identity-postgres-data:
  data-protection-keys:
